name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
        env:
          # 未认证配额是「每出口 IP」共享的，而 Actions runner 出口 IP 与他人共用 ——
          # 不注入时构建会偶发 403（脚本会静默沿用已提交的 JSON，不 fail，所以是静默劣化）。
          # 注入后 5000 次/小时。读公开仓库元数据不需要任何 scope，permissions 不用改。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 仅 main 推送时打包站点产物供部署（PR 只验证不部署）
      - name: 上传站点产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
