name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 临时诊断步骤：失败时把 npm 输出尾部写进 check 注解（日志接口要权限，注解免认证可读）
      - name: npm ci
        run: |
          set +e
          out=$(npm ci 2>&1)
          code=$?
          echo "$out" | tail -15
          if [ $code -ne 0 ]; then
            echo "$out" | grep -iE "error|EUSAGE|EINTEGRITY|EBADENGINE|403|404|ENOENT" | head -15 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # 仅 main 推送时打包站点产物供部署（PR 只验证不部署）
      - name: 上传站点产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
